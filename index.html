    <title>Host Bot</title>

    <meta name="theme-color" content="#4f46e5" />

    <meta property="og:title" content="Host Bot" />

        "name": "Host Bot",

          "@type": "Organization",
          "name": "Host Bot",
          "logo": {

            "url": "https://bot-host.xyz/logo.svg"
          }
        }

    <div id="root"></div>
