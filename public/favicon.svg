<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Premium Deep Navy / Indigo Background Gradient -->
    <radialGradient id="cardBg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Outer Rim Electric Glow -->
    <linearGradient id="rimGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Bot Head / Chassis Gradient -->
    <linearGradient id="botChassis" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Visor Face Gradient (Dark OLED Screen) -->
    <linearGradient id="visorOled" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0b132b" />
    </linearGradient>

    <!-- Glowing Cyan Eyes / Screen Elements -->
    <linearGradient id="cyanGlowEye" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Ear Headphones Gradient -->
    <linearGradient id="earPod" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Antenna Orb Glow -->
    <linearGradient id="orbGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Filters for Neon Lighting -->
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softHalo" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Icon Squircle (iOS App Icon Shape) -->
  <rect width="512" height="512" rx="128" fill="url(#cardBg)" />
  <rect x="3" y="3" width="506" height="506" rx="125" fill="none" stroke="url(#rimGlow)" stroke-width="4" opacity="0.8" />

  <!-- Ambient Internal Blue Halo -->
  <circle cx="256" cy="240" r="160" fill="#38bdf8" opacity="0.16" filter="url(#softHalo)" />
  <circle cx="256" cy="240" r="100" fill="#6366f1" opacity="0.2" filter="url(#softHalo)" />

  <!-- ================= TOP ANTENNA (TRANSMITTER) ================= -->
  <!-- Signal Broadcast Arcs -->
  <path d="M 216 76 A 46 46 0 0 0 216 104" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8" />
  <path d="M 296 76 A 46 46 0 0 1 296 104" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8" />
  <path d="M 198 64 A 68 68 0 0 0 198 116" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.4" />
  <path d="M 314 64 A 68 68 0 0 1 314 116" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.4" />

  <!-- Antenna Stem -->
  <rect x="250" y="88" width="12" height="42" rx="6" fill="#cbd5e1" />
  <!-- Glowing Antenna Tip -->
  <circle cx="256" cy="84" r="18" fill="url(#orbGlow)" filter="url(#neonBlur)" />
  <circle cx="256" cy="84" r="9" fill="#ffffff" />

  <!-- ================= EAR PODS / HEADPHONES ================= -->
  <!-- Left Ear Pod -->
  <rect x="92" y="196" width="36" height="88" rx="18" fill="url(#earPod)" />
  <rect x="100" y="214" width="8" height="52" rx="4" fill="#67e8f9" filter="url(#neonBlur)" />

  <!-- Right Ear Pod -->
  <rect x="384" y="196" width="36" height="88" rx="18" fill="url(#earPod)" />
  <rect x="404" y="214" width="8" height="52" rx="4" fill="#67e8f9" filter="url(#neonBlur)" />

  <!-- ================= BOT HEAD CHASSIS (SLEEK WHITE/METALLIC) ================= -->
  <rect x="118" y="124" width="276" height="232" rx="72" fill="url(#botChassis)" />
  <!-- Forehead Highlight -->
  <path d="M 160 144 Q 256 136 352 144" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.9" />

  <!-- ================= OLED VISOR FACE (DARK GLOSSY SCREEN) ================= -->
  <rect x="142" y="152" width="228" height="176" rx="52" fill="url(#visorOled)" stroke="#1e293b" stroke-width="3" />
  <!-- Visor Glass Reflection -->
  <path d="M 164 168 C 210 158 302 158 348 168" stroke="rgba(255,255,255,0.25)" stroke-width="3.5" stroke-linecap="round" fill="none" />

  <!-- ================= GLOWING ROBOT EYES (EXPRESSIVE & CUTE) ================= -->
  <!-- Left Eye -->
  <g filter="url(#neonBlur)">
    <!-- Eye Capsule -->
    <rect x="176" y="194" width="52" height="52" rx="22" fill="url(#cyanGlowEye)" />
    <!-- Pupil / Reflection Highlights -->
    <circle cx="192" cy="208" r="8" fill="#ffffff" />
    <circle cx="212" cy="226" r="4.5" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Right Eye -->
  <g filter="url(#neonBlur)">
    <!-- Eye Capsule -->
    <rect x="284" y="194" width="52" height="52" rx="22" fill="url(#cyanGlowEye)" />
    <!-- Pupil / Reflection Highlights -->
    <circle cx="300" cy="208" r="8" fill="#ffffff" />
    <circle cx="320" cy="226" r="4.5" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Cute Rosy Tech Cheeks (Cyber Blushing) -->
  <circle cx="172" cy="268" r="10" fill="#38bdf8" opacity="0.4" filter="url(#neonBlur)" />
  <circle cx="340" cy="268" r="10" fill="#38bdf8" opacity="0.4" filter="url(#neonBlur)" />

  <!-- Friendly Curved Bot Smile -->
  <path d="M 230 268 Q 256 288 282 268" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" fill="none" filter="url(#neonBlur)" />

  <!-- ================= ROBOT BODY / SERVER COLLAR (BOTTOM) ================= -->
  <!-- Neck Joint -->
  <rect x="228" y="356" width="56" height="18" rx="6" fill="#334155" />

  <!-- Chest Server Plate -->
  <path d="M 160 374 L 352 374 L 372 438 C 372 446 364 452 356 452 L 156 452 C 148 452 140 446 140 438 Z" fill="#0f172a" stroke="#1e293b" stroke-width="2" />

  <!-- 24/7 Hosting Live Server LED Indicators on Chest -->
  <!-- Live Status LED (Green 24/7) -->
  <circle cx="216" cy="412" r="7" fill="#10b981" filter="url(#neonBlur)" />
  <circle cx="216" cy="412" r="3" fill="#ffffff" />
  
  <!-- High Speed Activity LED (Cyan) -->
  <circle cx="256" cy="412" r="7" fill="#38bdf8" filter="url(#neonBlur)" />
  <circle cx="256" cy="412" r="3" fill="#ffffff" />

  <!-- Cloud Sync LED (Purple) -->
  <circle cx="296" cy="412" r="7" fill="#a855f7" filter="url(#neonBlur)" />
  <circle cx="296" cy="412" r="3" fill="#ffffff" />

  <!-- Server Vent Slots on Chest -->
  <line x1="200" y1="432" x2="312" y2="432" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />
</svg>
