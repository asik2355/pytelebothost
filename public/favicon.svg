<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="hostBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Outer Rim Holographic Glow -->
    <linearGradient id="rimGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.7" />
    </linearGradient>

    <!-- Bot Chassis Metallic Gradient -->
    <linearGradient id="helmetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Ears / Side Nodes Gradient -->
    <linearGradient id="earGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <!-- Glowing Cyan Accents -->
    <linearGradient id="cyanCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Robot Eyes Gradient -->
    <linearGradient id="eyeColor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Dynamic Orbital Hosting Arc -->
    <linearGradient id="orbitArc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Filters -->
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="statusGreen" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Icon Squircle (Card Canvas) -->
  <rect width="512" height="512" rx="128" fill="url(#hostBg)" />
  <rect x="3" y="3" width="506" height="506" rx="125" fill="none" stroke="url(#rimGlow)" stroke-width="4" opacity="0.65" />

  <!-- Ambient Internal Backdrop Lighting -->
  <circle cx="256" cy="220" r="140" fill="#4f46e5" opacity="0.22" filter="url(#cyanGlow)" />
  <circle cx="256" cy="260" r="95" fill="#06b6d4" opacity="0.18" filter="url(#cyanGlow)" />

  <!-- Antenna & 24/7 Broadcast Waves (Top Connectivity Indicator) -->
  <path d="M 204 88 A 56 56 0 0 0 204 116" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.85" />
  <path d="M 186 78 A 76 76 0 0 0 186 126" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.45" />
  <path d="M 308 88 A 56 56 0 0 1 308 116" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.85" />
  <path d="M 326 78 A 76 76 0 0 1 326 126" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.45" />

  <!-- Antenna Stem & Beacon -->
  <rect x="249" y="102" width="14" height="40" rx="7" fill="url(#cyanCore)" />
  <circle cx="256" cy="98" r="14" fill="#38bdf8" filter="url(#cyanGlow)" />
  <circle cx="256" cy="98" r="7" fill="#ffffff" />

  <!-- Side Cooling Ear Nodes / Server Connectors -->
  <rect x="116" y="210" width="30" height="78" rx="12" fill="url(#earGrad)" stroke="#4338ca" stroke-width="2" />
  <rect x="123" y="226" width="6" height="46" rx="3" fill="#38bdf8" opacity="0.9" filter="url(#cyanGlow)" />

  <rect x="366" y="210" width="30" height="78" rx="12" fill="url(#earGrad)" stroke="#4338ca" stroke-width="2" />
  <rect x="383" y="226" width="6" height="46" rx="3" fill="#38bdf8" opacity="0.9" filter="url(#cyanGlow)" />

  <!-- Main Cyber Bot Helmet Chassis -->
  <path d="M 166 150 C 166 138 176 130 188 130 L 324 130 C 336 130 346 138 346 150 L 358 290 C 358 326 328 350 286 354 L 226 354 C 184 350 154 326 154 290 Z" 
        fill="url(#helmetGrad)" stroke="#334155" stroke-width="3" />

  <!-- Forehead Accent Light -->
  <path d="M 210 148 L 302 148" stroke="#475569" stroke-width="3" stroke-linecap="round" />

  <!-- Cyber Visor (Digital Face Screen) -->
  <rect x="172" y="174" width="168" height="96" rx="28" fill="#030712" stroke="#1e293b" stroke-width="3" />
  
  <!-- Visor Curved Glass Specular Highlight -->
  <path d="M 188 186 C 220 180 292 180 324 186" stroke="rgba(255,255,255,0.18)" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Glowing Robot Eyes (Intelligent, Awake, Friendly) -->
  <!-- Left Eye -->
  <g filter="url(#cyanGlow)">
    <rect x="198" y="200" width="40" height="34" rx="14" fill="url(#eyeColor)" />
    <!-- Pupils / Specular Reflections -->
    <circle cx="210" cy="210" r="5" fill="#ffffff" />
    <circle cx="226" cy="222" r="3" fill="#ffffff" opacity="0.7" />
  </g>

  <!-- Right Eye -->
  <g filter="url(#cyanGlow)">
    <rect x="274" y="200" width="40" height="34" rx="14" fill="url(#eyeColor)" />
    <!-- Pupils / Specular Reflections -->
    <circle cx="286" cy="210" r="5" fill="#ffffff" />
    <circle cx="302" cy="222" r="3" fill="#ffffff" opacity="0.7" />
  </g>

  <!-- Friendly Smart Cyber Smile -->
  <path d="M 236 248 Q 256 256 276 248" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.85" />

  <!-- Server Blades & 24/7 Hosting Rack (Lower Collar of Bot) -->
  <!-- Blade 1 with Live Green Status LED -->
  <rect x="184" y="286" width="144" height="20" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="2" />
  <rect x="198" y="293" width="8" height="6" rx="2" fill="#334155" />
  <rect x="212" y="293" width="8" height="6" rx="2" fill="#334155" />
  <rect x="226" y="293" width="8" height="6" rx="2" fill="#334155" />
  <rect x="240" y="293" width="8" height="6" rx="2" fill="#334155" />
  <!-- Green 24/7 Live Status LED -->
  <circle cx="308" cy="296" r="4.5" fill="#10b981" filter="url(#statusGreen)" />
  <circle cx="308" cy="296" r="2" fill="#ffffff" />

  <!-- Blade 2 with High-Speed Data Blue LED -->
  <rect x="196" y="316" width="120" height="18" rx="7" fill="#090d16" stroke="#1e293b" stroke-width="2" />
  <rect x="210" y="322" width="6" height="6" rx="2" fill="#334155" />
  <rect x="222" y="322" width="6" height="6" rx="2" fill="#334155" />
  <rect x="234" y="322" width="6" height="6" rx="2" fill="#334155" />
  <!-- Cyan High-Speed Data LED -->
  <circle cx="294" cy="325" r="4" fill="#06b6d4" filter="url(#cyanGlow)" />
  <circle cx="294" cy="325" r="1.5" fill="#ffffff" />

  <!-- Dynamic Cloud Orbital Ring (Hosting / High-Speed Network) -->
  <ellipse cx="256" cy="386" rx="160" ry="38" fill="none" stroke="url(#orbitArc)" stroke-width="6" stroke-dasharray="140 25 70 25" stroke-linecap="round" />
  
  <!-- Cloud Node Connection Points on the Ring -->
  <circle cx="118" cy="376" r="8" fill="#38bdf8" filter="url(#cyanGlow)" />
  <circle cx="118" cy="376" r="4" fill="#ffffff" />

  <circle cx="394" cy="396" r="8" fill="#c084fc" filter="url(#cyanGlow)" />
  <circle cx="394" cy="396" r="4" fill="#ffffff" />

  <circle cx="256" cy="424" r="9" fill="#06b6d4" filter="url(#cyanGlow)" />
  <circle cx="256" cy="424" r="4.5" fill="#ffffff" />

  <!-- Lightning / Fast Execution Core Spark -->
  <path d="M 256 374 L 248 392 L 255 392 L 249 406 L 264 390 L 257 390 Z" fill="#38bdf8" filter="url(#cyanGlow)" />
</svg>
