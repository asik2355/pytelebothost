<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Deepest Space Dark Backdrop with Rich Indigo Ambient -->
    <radialGradient id="spaceCanvas" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="35%" stop-color="#0f172a" />
      <stop offset="75%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#02040a" />
    </radialGradient>

    <!-- Holographic Chamfer Rim Glow -->
    <linearGradient id="haloBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Ultra-Glossy Pearl White Helmet Chassis -->
    <linearGradient id="pearlChassis" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#f8fafc" />
      <stop offset="65%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Dark Mirror Visor (Like Apple Vision Pro / Daft Punk Glass) -->
    <linearGradient id="mirrorGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="45%" stop-color="#030712" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <!-- Super-Vibrant Cyan Electric Eye Gradient -->
    <linearGradient id="electricEye" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="25%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Electric Cyan Light Pulse -->
    <linearGradient id="cyanSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Headphones Ring Metallic -->
    <linearGradient id="headphoneRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Filters for High-End Cinematic Glow -->
    <filter id="hyperGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="ambientLight" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28" result="softBlur" />
      <feComposite in="SourceGraphic" in2="softBlur" operator="over" />
    </filter>

    <filter id="greenLiveGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ================= CANVAS BACKGROUND SQUIRCLE ================= -->
  <rect width="512" height="512" rx="130" fill="url(#spaceCanvas)" />
  <rect x="2.5" y="2.5" width="507" height="507" rx="127.5" fill="none" stroke="url(#haloBorder)" stroke-width="5" opacity="0.85" />

  <!-- Ambient Internal Cyber Halo (Gives high depth) -->
  <circle cx="256" cy="220" r="160" fill="#4f46e5" opacity="0.3" filter="url(#ambientLight)" />
  <circle cx="256" cy="220" r="95" fill="#38bdf8" opacity="0.25" filter="url(#ambientLight)" />

  <!-- ================= ANTENNA / TELEGRAM CLOUD BEACON ================= -->
  <!-- Wi-Fi / Cloud Waves -->
  <path d="M 204 70 A 58 58 0 0 0 204 102" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.9" />
  <path d="M 308 70 A 58 58 0 0 1 308 102" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.9" />
  <path d="M 184 56 A 84 84 0 0 0 184 116" stroke="#818cf8" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.5" />
  <path d="M 328 56 A 84 84 0 0 1 328 116" stroke="#818cf8" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.5" />

  <!-- Antenna Rod -->
  <rect x="249" y="86" width="14" height="42" rx="7" fill="#cbd5e1" stroke="#475569" stroke-width="1.5" />
  <!-- Glowing Floating Transmitter Sphere -->
  <circle cx="256" cy="80" r="18" fill="url(#cyanSpark)" filter="url(#hyperGlow)" />
  <circle cx="256" cy="80" r="8" fill="#ffffff" />

  <!-- ================= SIDE AUDIO / COMM HEADSETS ================= -->
  <!-- Left Cyber Headset -->
  <g filter="url(#hyperGlow)">
    <rect x="86" y="196" width="40" height="92" rx="20" fill="url(#headphoneRim)" />
    <!-- Ring detail -->
    <circle cx="106" cy="242" r="12" fill="#090d16" />
    <circle cx="106" cy="242" r="6" fill="#38bdf8" />
  </g>

  <!-- Right Cyber Headset -->
  <g filter="url(#hyperGlow)">
    <rect x="386" y="196" width="40" height="92" rx="20" fill="url(#headphoneRim)" />
    <!-- Ring detail -->
    <circle cx="406" cy="242" r="12" fill="#090d16" />
    <circle cx="406" cy="242" r="6" fill="#38bdf8" />
  </g>

  <!-- ================= MAIN PEARL ROBOT HELMET ================= -->
  <!-- Outer Chassis with smooth aerodynamic curves -->
  <rect x="114" y="122" width="284" height="240" rx="78" fill="url(#pearlChassis)" stroke="#e2e8f0" stroke-width="3" />

  <!-- Subtle 3D Top-Light Specular Glare -->
  <path d="M 160 142 Q 256 132 352 142" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.95" />

  <!-- Side Ear Groove Accents -->
  <line x1="130" y1="210" x2="130" y2="274" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  <line x1="382" y1="210" x2="382" y2="274" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />

  <!-- ================= BLACK MIRROR VISOR SCREEN ================= -->
  <rect x="140" y="152" width="232" height="180" rx="54" fill="url(#mirrorGlass)" stroke="#1e293b" stroke-width="3.5" />

  <!-- Curved Visor Specular Glass Reflection Arch -->
  <path d="M 162 170 C 215 158 297 158 350 170" stroke="rgba(255, 255, 255, 0.28)" stroke-width="4.5" stroke-linecap="round" fill="none" />
  <path d="M 172 182 C 220 172 292 172 340 182" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- ================= VIBRANT SMART BOT EYES (EXPRESSIVE & ALIVE) ================= -->
  <!-- Left Eye -->
  <g filter="url(#hyperGlow)">
    <!-- Eye Capsule Housing -->
    <rect x="174" y="196" width="56" height="56" rx="24" fill="url(#electricEye)" />
    
    <!-- Holographic Pupil Scanning Rings -->
    <circle cx="202" cy="224" r="16" fill="none" stroke="#e0f2fe" stroke-width="2.5" opacity="0.6" />
    
    <!-- Bright Eye Reflection Sparkle 1 -->
    <circle cx="192" cy="210" r="8.5" fill="#ffffff" />
    <!-- Small Secondary Reflection Sparkle 2 -->
    <circle cx="215" cy="232" r="4" fill="#ffffff" opacity="0.85" />
  </g>

  <!-- Right Eye -->
  <g filter="url(#hyperGlow)">
    <!-- Eye Capsule Housing -->
    <rect x="282" y="196" width="56" height="56" rx="24" fill="url(#electricEye)" />

    <!-- Holographic Pupil Scanning Rings -->
    <circle cx="310" cy="224" r="16" fill="none" stroke="#e0f2fe" stroke-width="2.5" opacity="0.6" />

    <!-- Bright Eye Reflection Sparkle 1 -->
    <circle cx="300" cy="210" r="8.5" fill="#ffffff" />
    <!-- Small Secondary Reflection Sparkle 2 -->
    <circle cx="323" cy="232" r="4" fill="#ffffff" opacity="0.85" />
  </g>

  <!-- High-Tech Neon Blushing Cheeks -->
  <circle cx="168" cy="272" r="11" fill="#38bdf8" opacity="0.35" filter="url(#hyperGlow)" />
  <circle cx="344" cy="272" r="11" fill="#38bdf8" opacity="0.35" filter="url(#hyperGlow)" />

  <!-- Friendly Tech Smile Curved Visor Display -->
  <path d="M 230 274 Q 256 294 282 274" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" fill="none" filter="url(#hyperGlow)" />

  <!-- ================= SERVER NECK & CHEST RACK (HOSTING FOUNDATION) ================= -->
  <!-- Neck Cable Connector -->
  <rect x="226" y="358" width="60" height="20" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <line x1="246" y1="362" x2="246" y2="374" stroke="#64748b" stroke-width="2" />
  <line x1="266" y1="362" x2="266" y2="374" stroke="#64748b" stroke-width="2" />

  <!-- Chest Server Blade (Hosting VPS Chassis) -->
  <path d="M 154 378 L 358 378 L 380 452 C 380 460 372 466 364 466 L 148 466 C 140 466 132 460 132 452 Z" 
        fill="#090d16" stroke="#334155" stroke-width="3" />

  <!-- Server Vent Grills on Chest Plate -->
  <line x1="168" y1="400" x2="344" y2="400" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
  
  <!-- 24/7 Hosting Live LED Indicators (Green, Cyan, Purple) -->
  <!-- 1. LIVE GREEN UP-TIME LED -->
  <g filter="url(#greenLiveGlow)">
    <circle cx="212" cy="428" r="8" fill="#10b981" />
    <circle cx="212" cy="428" r="3.5" fill="#ffffff" />
  </g>

  <!-- 2. HIGH SPEED EXECUTION CYAN LED -->
  <g filter="url(#hyperGlow)">
    <circle cx="256" cy="428" r="8" fill="#38bdf8" />
    <circle cx="256" cy="428" r="3.5" fill="#ffffff" />
  </g>

  <!-- 3. CLOUD SYNC PURPLE LED -->
  <g filter="url(#hyperGlow)">
    <circle cx="300" cy="428" r="8" fill="#a855f7" />
    <circle cx="300" cy="428" r="3.5" fill="#ffffff" />
  </g>

  <!-- Lower Server Air-Intake Slots -->
  <line x1="220" y1="448" x2="292" y2="448" stroke="#334155" stroke-width="3" stroke-linecap="round" />
</svg>
