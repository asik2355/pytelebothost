<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#5b21b6" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="pinkArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="hGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4f46e5" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Rounded Rectangle / Icon Shape -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Outer Glow Rings -->
  <circle cx="256" cy="256" r="180" stroke="url(#cyanArc)" stroke-width="24" stroke-linecap="round" stroke-dasharray="280 400" stroke-dashoffset="60" filter="url(#glow)" />
  <circle cx="256" cy="256" r="180" stroke="url(#pinkArc)" stroke-width="24" stroke-linecap="round" stroke-dasharray="260 420" stroke-dashoffset="-220" filter="url(#glow)" />

  <!-- Inner Soft Card Background -->
  <circle cx="256" cy="256" r="130" fill="#0f172a" stroke="#334155" stroke-width="6" />

  <!-- Server Bot Monogram H Graphic with Cloud Node Dots -->
  <!-- Left Pillar -->
  <rect x="180" y="166" width="32" height="180" rx="16" fill="url(#hGrad)" />
  <!-- Right Pillar -->
  <rect x="300" y="166" width="32" height="180" rx="16" fill="url(#hGrad)" />
  <!-- Crossbar with Server Connector -->
  <rect x="180" y="238" width="152" height="36" rx="18" fill="url(#cyanArc)" />

  <!-- Cloud Node Connection Points -->
  <circle cx="196" cy="182" r="8" fill="#38bdf8" />
  <circle cx="196" cy="330" r="8" fill="#38bdf8" />
  <circle cx="316" cy="182" r="8" fill="#ec4899" />
  <circle cx="316" cy="330" r="8" fill="#ec4899" />

  <!-- Central Pulse Indicator -->
  <circle cx="256" cy="256" r="10" fill="#ffffff" />
</svg>
